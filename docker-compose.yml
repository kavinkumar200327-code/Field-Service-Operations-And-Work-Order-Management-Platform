version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: servisync_postgres
    restart: always
    environment:
      POSTGRES_DB: field_service_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d field_service_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: servisync_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/field_service_ops
      SECRET_KEY: servisync-super-secret-key-evaluation-matrix-2026
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: production
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:80"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head && python -m app.core.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: servisync_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  backend_uploads:
